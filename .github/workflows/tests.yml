name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (race detector, Linux desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev shellcheck
      - name: Check shell scripts
        run: shellcheck install.sh scripts/*.sh
      - name: Run headless race tests
        run: go test -race ./...
      - name: Run desktop-tagged tests
        run: go test -tags desktop ./...
